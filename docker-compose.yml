services:
  cybersentinel:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The transformers/PEFT fallback engine adds ~2GB and is not used when
        # serving a GGUF. Set true only if you want the unquantised path.
        INSTALL_TORCH: ${INSTALL_TORCH:-false}
    image: cybersentinel:1.0.0
    container_name: cybersentinel
    init: true
    ports:
      - "${HOST_PORT:-5001}:5001"
    environment:
      PORT: 5001
      # Which GGUF to load, as seen INSIDE the container. Leave unset and the
      # service searches /app/models recursively and takes the first *.gguf.
      CTI_GGUF_PATH: ${CTI_GGUF_PATH:-}
      # 0 = CPU. Containers cannot reach Metal on macOS; on a CUDA host build
      # llama-cpp-python with GPU support and raise this.
      CTI_GPU_LAYERS: ${CTI_GPU_LAYERS:-0}
      CTI_N_CTX: ${CTI_N_CTX:-4096}
      # Generation threads; unset lets llama.cpp choose. On Apple's P+E core mix,
      # matching the performance-core count can beat using every core.
      CTI_THREADS: ${CTI_THREADS:-0}
      # CPU-only generation is far slower than Metal — a full reasoning response
      # measured 289s in this container on an M1. 600s leaves real headroom;
      # a timed-out request keeps running in Python and blocks the queue.
      CTI_TIMEOUT_MS: ${CTI_TIMEOUT_MS:-600000}
    volumes:
      # Point MODELS_DIR at the folder holding your .gguf — no need to copy the
      # file into the repo. Searched recursively, mounted read-only.
      #   MODELS_DIR=~/Downloads/grpo_cti_gguf docker compose up -d
      - ${MODELS_DIR:-./models}:/app/models:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
